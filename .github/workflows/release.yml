name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build release artifact
        run: bun scripts/build-release-artifacts.ts --platform macos --arch ${{ matrix.arch }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hobgoblin-macos-${{ matrix.arch }}
          path: release/Hobgoblin-*-${{ matrix.arch }}.dmg
          if-no-files-found: error

  build-windows:
    uses: ./.github/workflows/windows-test.yml
    with:
      official_release: true

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: hobgoblin-android
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  build-linux-source:
    name: Build Linux source deployment archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Linux source deployment archive
        run: node scripts/build-linux-source-archive.ts --output-dir release

      - name: Upload Linux source deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: hobgoblin-linux-source
          path: release/Hobgoblin-*-linux-source.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-android, build-linux-source]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          VERSION="$(bun -e "const root = await Bun.file('package.json').json(); const windows = await Bun.file('windows/package.json').json(); if (root.version !== windows.version) { throw new Error(\`windows/package.json version \${windows.version} must equal root package.json version \${root.version}\`) }; console.log(root.version)")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package.json version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare Android release asset
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE="release-assets/app-release-unsigned.apk"
          TARGET="release-assets/Hobgoblin-${VERSION}-android.apk"
          if [[ ! -f "$SOURCE" ]]; then
            echo "Missing Android release artifact: $SOURCE" >&2
            find release-assets -maxdepth 2 -type f -print >&2
            exit 1
          fi
          mv "$SOURCE" "$TARGET"

      - name: Validate release assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          EXPECTED=(
            "Hobgoblin-${VERSION}-arm64.dmg"
            "Hobgoblin-${VERSION}-x64.dmg"
            "Hobgoblin-${VERSION}-arm64.exe"
            "Hobgoblin-${VERSION}-x64.exe"
            "Hobgoblin-${VERSION}-android.apk"
            "Hobgoblin-${VERSION}-linux-source.tar.gz"
          )

          for asset in "${EXPECTED[@]}"; do
            if [[ ! -f "release-assets/$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              find release-assets -maxdepth 2 -type f -print >&2
              exit 1
            fi
          done

      - name: Load release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE="docs/releases/v${VERSION}.md"
          if [[ ! -s "$SOURCE" ]]; then
            echo "Missing release notes: $SOURCE" >&2
            exit 1
          fi
          cp "$SOURCE" release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          gh release upload "$TAG" \
            "release-assets/Hobgoblin-${VERSION}-arm64.dmg" \
            "release-assets/Hobgoblin-${VERSION}-x64.dmg" \
            "release-assets/Hobgoblin-${VERSION}-arm64.exe" \
            "release-assets/Hobgoblin-${VERSION}-x64.exe" \
            "release-assets/Hobgoblin-${VERSION}-android.apk" \
            "release-assets/Hobgoblin-${VERSION}-linux-source.tar.gz" \
            --clobber
