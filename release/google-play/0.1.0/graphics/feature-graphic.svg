<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title description">
  <title id="title">Hobgoblin Google Play feature graphic</title>
  <desc id="description">Hobgoblin wordmark beside a terminal prompt that becomes a cyan and green Git branch path.</desc>
  <defs>
    <linearGradient id="surface" x1="80" y1="40" x2="960" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" />
      <stop offset="1" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="branch" x1="760" y1="130" x2="920" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="1" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="#020617" />
  <path d="M0 430C160 360 310 458 488 408C666 358 812 222 1024 272V500H0Z" fill="#111827" opacity="0.72" />
  <rect x="64" y="52" width="896" height="396" rx="52" fill="url(#surface)" stroke="#334155" stroke-width="2" />

  <g aria-label="Hobgoblin">
    <text x="126" y="228" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="760" letter-spacing="-3">Hobgoblin</text>
    <text x="130" y="286" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="500">Remote worktrees. Persistent terminals.</text>
  </g>

  <g aria-label="Terminal prompt and Git branch">
    <path d="M650 176L724 250L650 324" fill="none" stroke="#F8FAFC" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M742 326H822" fill="none" stroke="#CBD5E1" stroke-width="24" stroke-linecap="round" />
    <path d="M822 326V190C822 148 850 126 896 126" fill="none" stroke="url(#branch)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="822" cy="326" r="27" fill="#22C55E" />
    <circle cx="822" cy="326" r="10" fill="#DCFCE7" />
    <circle cx="896" cy="126" r="27" fill="#38BDF8" />
    <circle cx="896" cy="126" r="10" fill="#DBEAFE" />
  </g>
</svg>
