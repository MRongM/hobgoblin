<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title description">
  <title id="title">Hobgoblin Google Play feature graphic</title>
  <desc id="description">A terminal prompt flowing into a Git branch beside the Hobgoblin wordmark.</desc>

  <defs>
    <linearGradient id="branch-gradient" x1="241" y1="169" x2="386" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="1" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="#020617" />
  <rect x="54" y="54" width="916" height="392" rx="38" fill="#111827" stroke="#1e293b" stroke-width="2" />

  <g aria-label="Terminal branch mark">
    <path d="M142 184l76 66-76 66" fill="none" stroke="#f8fafc" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M248 318h86" fill="none" stroke="#cbd5e1" stroke-width="24" stroke-linecap="round" />
    <path d="M266 169v69c0 68 47 104 120 104" fill="none" stroke="url(#branch-gradient)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="266" cy="169" r="22" fill="#38bdf8" />
    <circle cx="266" cy="169" r="9" fill="#dbeafe" />
    <circle cx="386" cy="342" r="22" fill="#22c55e" />
    <circle cx="386" cy="342" r="9" fill="#dcfce7" />
  </g>

  <g aria-label="Hobgoblin wordmark">
    <text x="464" y="241" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">Hobgoblin</text>
    <text x="468" y="300" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="500">Remote worktrees. Persistent terminals.</text>
  </g>
</svg>
