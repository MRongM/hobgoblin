<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <style>
      .ui { font-family: Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #111827; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; fill: #475569; }
      .title { font-size: 25px; font-weight: 700; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
      .body { font-size: 15px; font-weight: 500; }
      .small { font-size: 12px; font-weight: 500; }
      .muted { fill: #64748b; }
      .blue { fill: #2563eb; }
      .warn { fill: #b45309; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#e8eef8"/>
  <circle cx="140" cy="110" r="220" fill="#dbeafe"/>
  <circle cx="1450" cy="870" r="300" fill="#dbeafe"/>
  <text x="800" y="64" text-anchor="middle" class="ui title" font-size="28">Hobgoblin Android · 工作区 tmux 目录</text>
  <text x="800" y="93" text-anchor="middle" class="ui body muted">只读工作区导航 · 精确定位已有 tmux 终端 · 不创建或删除远端资源</text>

  <!-- Projects screen -->
  <g transform="translate(115 125)" filter="url(#shadow)">
    <rect width="610" height="800" rx="38" fill="#0f172a"/>
    <rect x="12" y="12" width="586" height="776" rx="30" fill="#f8fafc"/>
    <rect x="228" y="24" width="154" height="24" rx="12" fill="#111827"/>
    <text x="42" y="91" class="ui small muted">09:41</text>
    <text x="555" y="91" text-anchor="end" class="ui small muted">5G  87%</text>

    <text x="42" y="139" class="ui title">项目 · 开发服务器</text>
    <text x="554" y="139" text-anchor="end" class="ui body blue">显示全部</text>
    <line x1="42" y1="161" x2="556" y2="161" stroke="#e2e8f0"/>

    <text x="42" y="204" class="ui section">工作区</text>
    <text x="554" y="204" text-anchor="end" class="ui small blue">刷新</text>
    <rect x="42" y="222" width="514" height="128" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
    <rect x="42" y="222" width="6" height="128" rx="3" fill="#2563eb"/>
    <text x="68" y="261" class="ui section">product</text>
    <text x="68" y="291" class="mono body">/srv/product</text>
    <text x="68" y="323" class="ui small muted">3 个仓库 · 4 个子工作区</text>
    <text x="527" y="289" text-anchor="end" class="ui title blue">›</text>

    <text x="42" y="400" class="ui section">已保存项目</text>
    <rect x="42" y="418" width="514" height="150" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
    <text x="68" y="459" class="ui section">api</text>
    <text x="68" y="488" class="mono body">/srv/api</text>
    <text x="68" y="518" class="ui small muted">Git 仓库 · developer@example.invalid</text>
    <text x="68" y="548" class="ui small blue">打开　　终端　　删除</text>

    <rect x="28" y="699" width="554" height="68" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="110" y="741" text-anchor="middle" class="ui small muted">主机</text>
    <text x="305" y="741" text-anchor="middle" class="ui small blue" font-weight="700">项目</text>
    <text x="500" y="741" text-anchor="middle" class="ui small muted">终端</text>
  </g>

  <!-- Workspace overview screen -->
  <g transform="translate(875 125)" filter="url(#shadow)">
    <rect width="610" height="800" rx="38" fill="#0f172a"/>
    <rect x="12" y="12" width="586" height="776" rx="30" fill="#f8fafc"/>
    <rect x="228" y="24" width="154" height="24" rx="12" fill="#111827"/>
    <text x="42" y="91" class="ui small muted">09:41</text>
    <text x="555" y="91" text-anchor="end" class="ui small muted">5G  87%</text>

    <text x="42" y="139" class="ui body blue">‹ 返回</text>
    <text x="554" y="139" text-anchor="end" class="ui body blue">↻ 刷新</text>
    <text x="42" y="184" class="ui title">product</text>
    <text x="42" y="210" class="mono body">/srv/product</text>

    <rect x="42" y="233" width="514" height="54" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
    <text x="62" y="267" class="ui section">工作区仓库</text>
    <text x="532" y="267" text-anchor="end" class="ui body muted">3⌄</text>
    <text x="62" y="317" class="ui body">api</text>
    <text x="150" y="317" class="mono small">/srv/product/api</text>
    <text x="62" y="344" class="ui body">web</text>
    <text x="150" y="344" class="mono small">/srv/product/web</text>
    <text x="62" y="371" class="ui body">tools</text>
    <text x="150" y="371" class="mono small">/srv/product/tools</text>

    <text x="42" y="420" class="ui section">子工作区</text>
    <rect x="42" y="438" width="514" height="252" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="62" y="474" class="ui section">feature/auth</text>
    <text x="532" y="474" text-anchor="end" class="ui small blue">3 个终端</text>

    <line x1="75" y1="494" x2="75" y2="661" stroke="#93c5fd" stroke-width="3"/>
    <circle cx="75" cy="512" r="5" fill="#2563eb"/>
    <text x="94" y="517" class="ui small muted">工作区根目录</text>
    <text x="94" y="540" class="ui body blue">terminal-1</text>
    <text x="198" y="540" class="mono small">…/hobgoblin-feature-auth</text>

    <circle cx="75" cy="573" r="5" fill="#2563eb"/>
    <text x="94" y="578" class="ui small muted">api</text>
    <text x="94" y="601" class="ui body blue">terminal-1</text>
    <text x="198" y="601" class="mono small">…/feature-auth/api</text>

    <circle cx="75" cy="634" r="5" fill="#2563eb"/>
    <text x="94" y="639" class="ui small muted">web</text>
    <text x="94" y="662" class="ui body blue">terminal-2</text>
    <text x="198" y="662" class="mono small">…/feature-auth/web</text>

    <rect x="42" y="706" width="514" height="58" rx="15" fill="#ffffff" stroke="#dbe3ef"/>
    <text x="62" y="742" class="ui body">feature/search</text>
    <text x="532" y="742" text-anchor="end" class="ui small muted">暂无终端</text>
  </g>

  <text x="420" y="958" text-anchor="middle" class="ui small muted">Host 过滤后的 Projects：远端工作区独立于本地已保存项目</text>
  <text x="1180" y="958" text-anchor="middle" class="ui small muted">工作区概览：一次只展开一个子工作区，点击终端即精确 attach</text>
</svg>
