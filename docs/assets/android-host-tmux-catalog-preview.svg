<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Android host Projects, tmux actions, and safe deletion</title>
  <desc id="desc">Three mobile screens showing the host project list, state-aware tmux terminal actions, and a delete dialog with an unchecked remote-close option.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui { font-family: Inter, Roboto, Arial, sans-serif; fill: #172033; }
      .title { font-size: 20px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 650; }
      .body { font-size: 14px; }
      .meta { font-size: 12px; fill: #657087; }
      .action { font-size: 14px; font-weight: 650; fill: #315ACD; }
      .danger { font-size: 14px; font-weight: 650; fill: #B3261E; }
      .warning { font-size: 12px; fill: #657087; }
    </style>
  </defs>

  <rect width="1440" height="860" fill="#E9EEF6"/>
  <text x="720" y="48" class="ui title" text-anchor="middle">Host 详情 · Projects / tmux</text>
  <text x="720" y="74" class="ui meta" text-anchor="middle">实色页面 · 状态感知终端操作 · 远程关闭默认不勾选</text>

  <g transform="translate(40 105)" filter="url(#shadow)">
    <rect width="380" height="700" rx="30" fill="#F8FAFD" stroke="#CDD5E3"/>
    <rect x="0" y="0" width="380" height="78" rx="30" fill="#FFFFFF"/>
    <rect x="0" y="48" width="380" height="30" fill="#FFFFFF"/>
    <text x="24" y="48" class="ui action">返回</text>
    <text x="190" y="48" class="ui title" text-anchor="middle">开发服务器</text>

    <rect x="0" y="78" width="380" height="54" fill="#FFFFFF"/>
    <text x="95" y="110" class="ui label" text-anchor="middle">项目</text>
    <text x="285" y="110" class="ui body" text-anchor="middle" fill="#657087">tmux</text>
    <rect x="28" y="128" width="134" height="4" rx="2" fill="#315ACD"/>

    <text x="24" y="174" class="ui label">此主机上的项目</text>
    <text x="24" y="196" class="ui meta">只显示 Android 已保存项目</text>

    <g transform="translate(20 220)">
      <rect width="340" height="142" rx="16" fill="#FFFFFF" stroke="#DCE2EC"/>
      <text x="18" y="32" class="ui label">Hobgoblin</text>
      <text x="18" y="56" class="ui meta">/srv/projects/hobgoblin</text>
      <rect x="18" y="76" width="90" height="24" rx="12" fill="#E8EEFF"/>
      <text x="63" y="93" class="ui meta" text-anchor="middle" fill="#315ACD">Git 仓库</text>
      <text x="18" y="126" class="ui action">打开</text>
      <text x="76" y="126" class="ui action">终端</text>
      <text x="138" y="126" class="ui action">删除</text>
    </g>

    <g transform="translate(20 378)">
      <rect width="340" height="142" rx="16" fill="#FFFFFF" stroke="#DCE2EC"/>
      <text x="18" y="32" class="ui label">Deploy scripts</text>
      <text x="18" y="56" class="ui meta">/srv/tools/deploy</text>
      <rect x="18" y="76" width="98" height="24" rx="12" fill="#EEF0F5"/>
      <text x="67" y="93" class="ui meta" text-anchor="middle">普通目录</text>
      <text x="18" y="126" class="ui action">打开</text>
      <text x="76" y="126" class="ui action">终端</text>
      <text x="138" y="126" class="ui action">删除</text>
    </g>
  </g>

  <g transform="translate(530 105)" filter="url(#shadow)">
    <rect width="380" height="700" rx="30" fill="#F8FAFD" stroke="#CDD5E3"/>
    <rect x="0" y="0" width="380" height="78" rx="30" fill="#FFFFFF"/>
    <rect x="0" y="48" width="380" height="30" fill="#FFFFFF"/>
    <text x="24" y="48" class="ui action">返回</text>
    <text x="190" y="48" class="ui title" text-anchor="middle">开发服务器</text>
    <text x="350" y="48" class="ui action" text-anchor="end">刷新</text>

    <rect x="0" y="78" width="380" height="54" fill="#FFFFFF"/>
    <text x="95" y="110" class="ui body" text-anchor="middle" fill="#657087">项目</text>
    <text x="285" y="110" class="ui label" text-anchor="middle">tmux</text>
    <rect x="218" y="128" width="134" height="4" rx="2" fill="#315ACD"/>

    <text x="24" y="174" class="ui label">hobgoblin</text>
    <text x="24" y="196" class="ui meta">/srv/projects/hobgoblin</text>

    <g transform="translate(20 218)">
      <rect width="340" height="142" rx="16" fill="#FFFFFF" stroke="#DCE2EC"/>
      <rect x="16" y="18" width="4" height="68" rx="2" fill="#315ACD"/>
      <text x="36" y="36" class="ui label">terminal-1</text>
      <text x="320" y="36" class="ui meta" text-anchor="end" fill="#19764B">1 个客户端</text>
      <text x="36" y="62" class="ui meta">项目 server · …22222222</text>
      <text x="36" y="84" class="ui meta">session · …11111111</text>
      <line x1="20" y1="100" x2="320" y2="100" stroke="#EEF1F6"/>
      <text x="196" y="128" class="ui danger">关闭</text>
      <text x="244" y="128" class="ui danger">删除</text>
      <text x="292" y="128" class="ui action">打开</text>
    </g>

    <g transform="translate(20 376)">
      <rect width="340" height="142" rx="16" fill="#FFFFFF" stroke="#DCE2EC"/>
      <rect x="16" y="18" width="4" height="68" rx="2" fill="#7657C4"/>
      <text x="36" y="36" class="ui label">terminal-2</text>
      <text x="320" y="36" class="ui meta" text-anchor="end">空闲 · 已断开</text>
      <text x="36" y="62" class="ui meta">默认 server</text>
      <text x="36" y="84" class="ui meta">session · …33333333</text>
      <line x1="20" y1="100" x2="320" y2="100" stroke="#EEF1F6"/>
      <text x="176" y="128" class="ui action">重连</text>
      <text x="232" y="128" class="ui danger">删除</text>
      <text x="288" y="128" class="ui action">打开</text>
    </g>

    <text x="24" y="556" class="ui label">feature-auth</text>
    <text x="24" y="578" class="ui meta">/srv/projects/hobgoblin-feature-auth</text>
    <g transform="translate(20 598)">
      <rect width="340" height="82" rx="16" fill="#FFFFFF" stroke="#DCE2EC"/>
      <rect x="16" y="14" width="4" height="54" rx="2" fill="#315ACD"/>
      <text x="36" y="34" class="ui label">terminal-1</text>
      <text x="320" y="34" class="ui meta" text-anchor="end">未在 Android 留存</text>
      <text x="36" y="60" class="ui meta">项目 server · …44444444</text>
      <text x="292" y="62" class="ui action">打开</text>
    </g>
  </g>

  <g transform="translate(1020 105)" filter="url(#shadow)">
    <rect width="380" height="700" rx="30" fill="#F8FAFD" stroke="#CDD5E3"/>
    <rect x="0" y="0" width="380" height="78" rx="30" fill="#FFFFFF"/>
    <rect x="0" y="48" width="380" height="30" fill="#FFFFFF"/>
    <text x="24" y="48" class="ui action">返回</text>
    <text x="190" y="48" class="ui title" text-anchor="middle">开发服务器</text>
    <rect x="0" y="78" width="380" height="54" fill="#FFFFFF"/>
    <text x="95" y="110" class="ui body" text-anchor="middle" fill="#657087">项目</text>
    <text x="285" y="110" class="ui label" text-anchor="middle">tmux</text>
    <rect x="218" y="128" width="134" height="4" rx="2" fill="#315ACD"/>
    <text x="24" y="174" class="ui label">hobgoblin</text>
    <text x="24" y="196" class="ui meta">/srv/projects/hobgoblin</text>
    <rect x="20" y="218" width="340" height="142" rx="16" fill="#FFFFFF" stroke="#DCE2EC"/>
    <rect x="36" y="236" width="4" height="68" rx="2" fill="#315ACD"/>
    <text x="56" y="254" class="ui label">terminal-1</text>
    <text x="340" y="254" class="ui meta" text-anchor="end">1 个客户端</text>
    <text x="56" y="280" class="ui meta">项目 server · …22222222</text>
    <text x="56" y="302" class="ui meta">session · …11111111</text>

    <rect width="380" height="700" rx="30" fill="#172033" opacity="0.30"/>
    <g transform="translate(24 146)">
      <rect width="332" height="410" rx="24" fill="#FFFFFF"/>
      <text x="24" y="42" class="ui title">删除 tmux 终端？</text>
      <text x="24" y="78" class="ui body">从 Android 终端列表删除 terminal-1，</text>
      <text x="24" y="100" class="ui body">并停止其活动连接。</text>
      <text x="24" y="130" class="ui meta">远程 tmux 会话默认继续运行。</text>

      <rect x="24" y="164" width="22" height="22" rx="4" fill="#FFFFFF" stroke="#657087" stroke-width="2"/>
      <text x="58" y="181" class="ui label">同时关闭远程 tmux 会话</text>
      <text x="58" y="208" class="ui warning">会结束会话中的进程，</text>
      <text x="58" y="228" class="ui warning">并断开其他客户端，且无法撤销。</text>

      <rect x="20" y="252" width="292" height="72" rx="12" fill="#FFF3F1"/>
      <rect x="34" y="270" width="4" height="36" rx="2" fill="#B3261E"/>
      <text x="50" y="284" class="ui meta">安全默认值</text>
      <text x="50" y="306" class="ui body">未勾选：只删除 Android 本地记录</text>

      <text x="206" y="378" class="ui action">取消</text>
      <text x="264" y="378" class="ui danger">删除终端</text>
    </g>
  </g>

  <g transform="translate(386 827)">
    <rect width="12" height="4" rx="2" fill="#315ACD"/>
    <text x="20" y="5" class="ui meta">项目 server</text>
    <rect x="168" width="12" height="4" rx="2" fill="#7657C4"/>
    <text x="188" y="5" class="ui meta">默认 server</text>
    <text x="360" y="5" class="ui meta">· 路径分组 · 本地生命周期操作 · 精确远程关闭</text>
  </g>
</svg>
